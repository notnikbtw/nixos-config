
source = ~/.config/themes/current/hyprlock.conf

general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = false
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/themes/current-wallpaper.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    color = $bg0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg1
    font_size = 90
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $fg2
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(fortune -s | tr '\n' ' ' | fold -s -w 60 | head -1)"
    color = $fg2
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $orange
    inner_color = $bg1
    font_color = $fg1
    fade_on_empty = false
    placeholder_text = <span foreground="##928374">Password...</span>
    hide_input = false

    check_color = $aqua
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300

    capslock_color = $yellow
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] echo "  $(date +'%Z')  Locked"
    color = $gray
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
